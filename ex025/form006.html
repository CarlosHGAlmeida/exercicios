<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="" method="get">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor" required value="#00cc00">
            <label for=""></label>
        </p>
        <p>
            <label for="inivel">Nível de Satisfação: </label>
            <input type="range" name="nivel" id="inivel" min="0" max="10" required>
        </p>
        <p><label for="ifoto">Foto do perfil: </label>
            <input type="file" name="foto" id="ifoto" required>
        </p>
        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>
    </form>
    
</body>
</html>
