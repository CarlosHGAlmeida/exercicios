<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masculino" value="Masculino" required>
            <label for="masculino">Masculino</label><br>
            <input type="radio" name="sexo" id="feminino" value="Feminino" required>
            <label for="feminino">Feminino</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esportes[]" id="futebol" value="Futebol">
            <label for="futebol">Futebol</label><br>
            <input type="checkbox" name="esportes[]" id="basquete" value="Basquete">
            <label for="basquete">Basquete</label><br>
            <input type="checkbox" name="esportes[]" id="tenis" value="Tênis">
            <label for="tenis">Tênis</label><br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
